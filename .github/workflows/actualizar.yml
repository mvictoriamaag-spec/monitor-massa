name: Actualizar menciones

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch:          # botón "Run workflow" para actualizar a mano

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Instalar Claude Code (resúmenes con tu plan de Claude)
        run: npm install -g @anthropic-ai/claude-code

      - name: Buscar menciones y generar la página
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python actualizar.py

      - name: Guardar el historial en el repositorio
        run: |
          git config user.name "monitor-massa"
          git config user.email "monitor-massa@users.noreply.github.com"
          git add datos
          if ! git diff --cached --quiet; then
            git commit -m "Menciones $(TZ=America/Argentina/Buenos_Aires date '+%d/%m %H:%M')"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: publicar
        uses: actions/deploy-pages@v4
